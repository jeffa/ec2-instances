---
- name: Install and configure Docker
  hosts: ungrouped
  become: true
  gather_facts: false
  vars:
    # The Terraform-generated inventory provides ansible_user.
    docker_user: "{{ ansible_user | default(ansible_user_id) }}"

  tasks:
    - name: Wait for SSH and the operating system to become ready
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: 5
        sleep: 5

    - name: Gather operating system facts
      ansible.builtin.setup:

    - name: Install Docker on Debian-family hosts
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install Docker on Red Hat-family hosts
      ansible.builtin.package:
        name: docker
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Install Docker on SUSE-family hosts
      ansible.builtin.zypper:
        name: docker
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Suse"

    - name: Fail clearly on unsupported operating systems
      ansible.builtin.fail:
        msg: "Docker installation is not defined for {{ ansible_facts.distribution }} ({{ ansible_facts.os_family }})."
      when: ansible_facts.os_family not in ["Debian", "RedHat", "Suse"]

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add the Ansible login user to the Docker group
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
